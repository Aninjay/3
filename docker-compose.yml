services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cultural_committee}
      POSTGRES_USER: ${POSTGRES_USER:-tapmi_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      PORT: "5000"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-tapmi_app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-cultural_committee}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      BOOTSTRAP_CONVENER_EMAIL: ${BOOTSTRAP_CONVENER_EMAIL:-}
      BOOTSTRAP_CONVENER_PASSWORD: ${BOOTSTRAP_CONVENER_PASSWORD:-}
      PILOT_EVENT_NAME: ${PILOT_EVENT_NAME:-Kala Fest}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the deployed frontend origin}
    ports:
      - "${APP_PORT:-5000}:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, os, urllib.request; p=os.environ.get('PORT', '5000'); d=json.load(urllib.request.urlopen(f'http://127.0.0.1:{p}/api/v1/health', timeout=5)); raise SystemExit(0 if d.get('status') == 'healthy' and d.get('database', {}).get('connected') else 1)"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
